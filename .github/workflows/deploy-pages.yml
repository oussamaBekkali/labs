name: Deploy Lab Erreur JS to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'lab-erreur-js/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Marp presentation
        run: |
          mkdir -p dist
          npx --yes @marp-team/marp-cli@latest --no-stdin "lab-erreur-js/lab-erreur-js.md" --html -o dist/index.html

      - name: Validate build output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html was not generated" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
